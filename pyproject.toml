[project]
name = "geometor-ptolemy"
dynamic = ["version"]
authors = [
  { name = "geometor", email = "github@geometor.com" },
]
description = "Digital Scriptorium Book Codex and exact symbolic SymPy / geometor.model demonstrations for Claudius Ptolemy's Almagest (Book I Chs. 1-14) and Planisphaerium."
readme = "README.rst"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sympy",
    "rich",
    "geometor-model",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
ptolemy = "geometor.ptolemy.__main__:main"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.ptolemy.__version__"}

[project.urls]
"Website" = "https://geometor.github.io/ptolemy"
"Repository" = "https://github.com/geometor/ptolemy"
"Issues" = "https://github.com/geometor/ptolemy/issues"

[tool.ruff]
lint.select = ["E", "F", "I", "ANN", "D"]
lint.ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
