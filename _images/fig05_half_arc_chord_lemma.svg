    <text class="geom-label" x="270.00" y="315.00" text-anchor="middle" style="font-size: 13px; opacity: 0.82;">AE = AB, ΔZ ⊥ AΓ  ⇒  EZ = ZΓ = ½ EΓ  ⇒  ΓΔ² = AΓ · ΓZ = ½ AΓ · EΓ</text>
