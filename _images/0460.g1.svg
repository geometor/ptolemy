        --geom-muted: #94a3b8;
      }
    }
    .euclid-graphic .geom-line,
    .euclid-graphic .geom-circle,
    .euclid-graphic .geom-arc {
      fill: none;
      stroke: var(--geom-fg);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .euclid-graphic .geom-dashed {
      fill: none;
      stroke: var(--geom-muted);
      stroke-width: 1.25;
      stroke-dasharray: 5 4;
    }
    .euclid-graphic .geom-ang-arc {
      fill: none;
      stroke: var(--geom-muted);
      stroke-width: 1.25;
    }
    .euclid-graphic .geom-overlay {
      fill: none;
      stroke: transparent;
      stroke-width: 3.5;
      stroke-linecap: round;
    }
    .euclid-graphic .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-bg);
      stroke-width: 1.2;
    }
    .euclid-graphic .geom-label {
      fill: var(--geom-fg);
      font-style: italic;
      font-size: 18px;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
  </style>
