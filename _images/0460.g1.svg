  <style>
    .euclid-graphic {
      --geom-fg: #1a1a1a;
      --geom-bg: #ffffff;
      --geom-accent: #d97706;
      --geom-assert: #16a34a;
      --geom-muted: #64748b;
      color: var(--geom-fg);
      background: transparent;
      font-family: "Times New Roman", "Gentium Plus", Georgia, serif;
    }
    @media (prefers-color-scheme: dark) {
      .euclid-graphic {
        --geom-fg: #e2e8f0;
        --geom-bg: #0f172a;
        --geom-accent: #f59e0b;
