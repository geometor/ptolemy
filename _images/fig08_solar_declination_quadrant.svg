    <text class="geom-label" x="260.00" y="396.00" text-anchor="middle" style="font-size: 13px; opacity: 0.82;">crd(2 HΘ) / crd(180°) = [crd(2 AB) / crd(2 ZB)] · [crd(2 EH) / crd(2 EB)]  ⇒  sin δ = sin ε · sin λ</text>
