  <g id="labels">
    <text class="geom-label" x="63.00" y="214.00" text-anchor="middle" dominant-baseline="central" style="font-style: italic; font-size: 13px;" data-ref="A">A (Equator)</text>
    <text class="geom-label" x="76.25" y="137.30" text-anchor="middle" dominant-baseline="central" style="font-style: italic; font-size: 13px;" data-ref="B">B (Solstice)</text>
