  <style>
    .euclid-graphic {
      --geom-fg: #1a1a1a;
      --geom-bg: #ffffff;
      --geom-accent: #d97706;
      --geom-assert: #16a34a;
      --geom-muted: #64748b;
      color: var(--geom-fg);
      background: transparent;
      font-family: "Times New Roman", "Gentium Plus", Georgia, serif;
    }
    @media (prefers-color-scheme: dark) {
      .euclid-graphic {
        --geom-fg: #e2e8f0;
        --geom-bg: #0f172a;
        --geom-accent: #f59e0b;
        --geom-assert: #22c55e;
        --geom-muted: #94a3b8;
      }
    }
    .euclid-graphic .geom-line,
    .euclid-graphic .geom-circle,
    .euclid-graphic .geom-arc {
      fill: none;
      stroke: var(--geom-fg);
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .euclid-graphic .geom-dashed {
      fill: none;
      stroke: var(--geom-muted);
      stroke-width: 1.25;
      stroke-dasharray: 5 4;
    }
    .euclid-graphic .geom-ang-arc {
      fill: none;
      stroke: var(--geom-muted);
      stroke-width: 1.25;
    }
    .euclid-graphic .geom-overlay {
      fill: none;
      stroke: transparent;
      stroke-width: 3.5;
      stroke-linecap: round;
    }
    .euclid-graphic .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-bg);
      stroke-width: 1.2;
    }
    .euclid-graphic .geom-label {
      fill: var(--geom-fg);
      font-style: italic;
      font-size: 18px;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }
  </style>
