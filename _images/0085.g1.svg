      fill: none;
      stroke: transparent;
      stroke-width: 3.5;
      stroke-linecap: round;
    }
    .euclid-graphic .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-bg);
      stroke-width: 1.2;
    }
    .euclid-graphic .geom-label {
      fill: var(--geom-fg);
      font-style: italic;
      font-size: 18px;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
